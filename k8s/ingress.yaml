apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-app
  labels:
    app.kubernetes.io/name: example-app
spec:
  ingressClassName: traefik
  rules:
    - host: example-app.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example-app
                port:
                  number: 80
