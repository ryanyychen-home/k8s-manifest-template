apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: example-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8080
          protocol: TCP
